<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あつ森 いま捕れるもの</title>
<style>
:root{--panel:#fffdf4;--ink:#26433a;--muted:#6f7f78;--accent:#38a978;--line:#dce4d9;--danger:#c75b55;--shadow:0 10px 30px rgba(38,67,58,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:linear-gradient(180deg,#dff4e8 0,#f5f1df 280px);color:var(--ink)}header{padding:28px 18px 20px;text-align:center}h1{margin:0;font-size:clamp(26px,7vw,44px)}header p{margin:8px 0 0;color:var(--muted)}main{width:min(1100px,calc(100% - 24px));margin:auto;padding-bottom:60px}.panel{background:rgba(255,253,244,.96);border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:var(--muted)}select,input,button{font:inherit}select,input[type=datetime-local],input[type=search]{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:11px 12px;color:var(--ink)}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white}.danger{background:#fff0ee;color:var(--danger)}.switchline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.check{display:inline-flex;align-items:center;gap:7px;background:#edf4ef;border-radius:999px;padding:9px 12px;font-size:14px;font-weight:700}.check input{accent-color:var(--accent)}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.now{font-weight:800;font-size:18px}.summary{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;background:#edf4ef;font-weight:700;font-size:13px}.badge strong{font-size:16px}.tabs{display:flex;gap:8px;overflow:auto}.tab{white-space:nowrap;background:#edf4ef;color:var(--ink)}.tab.active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:10px;min-height:175px}.card.caught{opacity:.55}.cardhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font-size:20px;font-weight:800}.type{font-size:12px;border-radius:999px;padding:5px 8px;background:#edf4ef;font-weight:700}.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 9px;font-size:14px}.meta dt{color:var(--muted);font-weight:700}.meta dd{margin:0;font-weight:600}.caughtBtn{position:absolute;right:12px;bottom:12px;width:38px;height:38px;padding:0;border-radius:50%;background:#e7efe9;color:var(--ink);font-size:20px}.caught .caughtBtn{background:var(--accent);color:white}.empty,.loading{text-align:center;padding:40px 12px;color:var(--muted)}.error{color:var(--danger);line-height:1.7}.note{font-size:12px;line-height:1.7;color:var(--muted)}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.controls,.grid{grid-template-columns:1fr}.card{min-height:0;padding-bottom:58px}}
</style></head><body>
<header><h1>🌿 あつ森 いま捕れるもの</h1><p>現在の月・時間に出現する虫、魚、海の幸を表示</p></header><main>
<section class="panel controls"><div class="field"><label>島の半球</label><select id="hemisphere"><option value="northern">北半球</option><option value="southern">南半球</option></select></div><div class="field"><label>日時</label><select id="mode"><option value="now">現在日時</option><option value="custom">指定日時</option></select></div><div class="field"><label>ゲーム内日時</label><input id="customDate" type="datetime-local" disabled></div><button id="refresh" class="primary">現在時刻に更新</button></section>
<section class="panel"><div class="status"><div id="nowText" class="now"></div><div class="summary"><span class="badge">表示 <strong id="visibleCount">0</strong></span><span class="badge">捕獲済み <strong id="caughtCount">0</strong></span></div></div></section>
<section class="panel"><div class="tabs" id="tabs"><button class="tab active" data-type="all">すべて</button><button class="tab" data-type="fish">🐟 魚</button><button class="tab" data-type="bugs">🦋 虫</button><button class="tab" data-type="sea">🫧 海の幸</button></div><div style="height:12px"></div><div class="switchline"><label class="check"><input id="hideCaught" type="checkbox" checked>捕獲済みを除外</label><label class="check"><input id="onlyLeaving" type="checkbox">今月で終了のみ</label><input id="search" type="search" placeholder="名前・場所で検索" style="flex:1;min-width:190px"><button id="resetCaught" class="danger">捕獲状況をリセット</button></div></section>
<section id="content" class="grid"><div class="panel loading" style="grid-column:1/-1">data.jsonを読み込んでいます…</div></section>
<section class="panel note">出現月・時間帯は <code>data.json</code> の数値配列のみで判定します。終了時刻は含みません。例：17時〜翌8時は17〜23時と0〜7時です。</section>
</main><script>
const TYPE_LABEL={fish:'魚',bugs:'虫',sea:'海の幸'},TYPE_ICON={fish:'🐟',bugs:'🦋',sea:'🫧'};let data=[],activeType='all';const $=s=>document.querySelector(s);
function caughtSet(){try{return new Set(JSON.parse(localStorage.getItem('acnh-caught-v2')||'[]'))}catch{return new Set()}}function saveCaught(s){localStorage.setItem('acnh-caught-v2',JSON.stringify([...s]))}function currentDate(){return $('#mode').value==='custom'&&$('#customDate').value?new Date($('#customDate').value):new Date()}
function compressMonths(a){if(a.length===12)return'一年中';const s=[...a].sort((x,y)=>x-y),r=[];let st=s[0],pr=s[0];for(let i=1;i<=s.length;i++){const v=s[i];if(v===pr+1){pr=v;continue}r.push(st===pr?`${st}月`:`${st}〜${pr}月`);st=pr=v}return r.join('、')}
function fmtHours(h){const s=[...h].sort((a,b)=>a-b);if(s.length===24)return'一日中';const ranges=[];let st=s[0],pr=s[0];for(let i=1;i<=s.length;i++){const v=s[i];if(v===pr+1){pr=v;continue}ranges.push([st,(pr+1)%24]);st=pr=v}if(ranges.length>=2&&ranges[0][0]===0&&ranges.at(-1)[1]===0){const last=ranges.pop(),first=ranges.shift();ranges.unshift([last[0],first[1],true])}return ranges.map(([a,b,overnight])=>overnight||a>b?`${a}時〜翌${b}時`:`${a}時〜${b}時`).join('、')}
function isAvailable(x,d,h){return x.months[h].includes(d.getMonth()+1)&&x.hours.includes(d.getHours())}function isLeaving(x,d,h){const m=d.getMonth()+1,n=m===12?1:m+1;return x.months[h].includes(m)&&!x.months[h].includes(n)}
function card(x,c,h){return `<article class="card ${c?'caught':''}" data-key="${x.key}"><div class="cardhead"><div class="name">${x.name}</div><span class="type">${TYPE_ICON[x.type]} ${TYPE_LABEL[x.type]}</span></div><dl class="meta"><dt>場所</dt><dd>${x.location||'—'}</dd><dt>時間</dt><dd>${fmtHours(x.hours)}</dd><dt>時期</dt><dd>${compressMonths(x.months[h])}</dd>${x.detail?`<dt>特徴</dt><dd>${x.detail}</dd>`:''}<dt>売値</dt><dd>${Number(x.price||0).toLocaleString()}ベル</dd></dl><button class="caughtBtn">${c?'✓':'○'}</button></article>`}
function render(){const d=currentDate(),h=$('#hemisphere').value,c=caughtSet(),q=$('#search').value.trim().toLowerCase();$('#nowText').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}・${h==='northern'?'北半球':'南半球'}`;let list=data.filter(x=>isAvailable(x,d,h));if(activeType!=='all')list=list.filter(x=>x.type===activeType);if($('#hideCaught').checked)list=list.filter(x=>!c.has(x.key));if($('#onlyLeaving').checked)list=list.filter(x=>isLeaving(x,d,h));if(q)list=list.filter(x=>`${x.name} ${x.location}`.toLowerCase().includes(q));list.sort((a,b)=>a.type.localeCompare(b.type)||b.price-a.price);$('#visibleCount').textContent=list.length;$('#caughtCount').textContent=c.size;$('#content').innerHTML=list.length?list.map(x=>card(x,c.has(x.key),h)).join(''):'<div class="panel empty" style="grid-column:1/-1">条件に合う生き物はいません。</div>';document.querySelectorAll('.caughtBtn').forEach(b=>b.onclick=()=>{const k=b.closest('.card').dataset.key,s=caughtSet();s.has(k)?s.delete(k):s.add(k);saveCaught(s);render()})}
async function load(){try{const r=await fetch('./data.json?v=2',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);data=await r.json();if(!Array.isArray(data)||!data.length)throw new Error('データが空です');render()}catch(e){$('#content').innerHTML=`<div class="panel error" style="grid-column:1/-1"><strong>data.jsonを読み込めません。</strong><br>index.htmlと同じ階層にdata.jsonを置いてください。<br><small>${e.message}</small></div>`}}
$('#mode').onchange=()=>{$('#customDate').disabled=$('#mode').value!=='custom';render()};$('#refresh').onclick=()=>{if($('#mode').value==='custom')$('#mode').value='now';$('#customDate').disabled=true;render()};['hemisphere','customDate','hideCaught','onlyLeaving'].forEach(id=>$('#'+id).onchange=render);$('#search').oninput=render;$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;activeType=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};$('#resetCaught').onclick=()=>{if(confirm('捕獲済みをすべて削除しますか？')){localStorage.removeItem('acnh-caught-v2');render()}};const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());$('#customDate').value=n.toISOString().slice(0,16);load();setInterval(()=>{$('#mode').value==='now'&&render()},60000);
</script></body></html>
