<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>data.json生成</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.7}button{font-size:18px;padding:12px 18px}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px}</style></head><body><h1>あつ森 data.json生成</h1><p>このページをSafariまたはChromeで開き、「生成して保存」を押してください。外部データを取得するのはこの生成時だけです。完成したdata.jsonをindex.htmlと同じ場所へアップロードします。</p><button id="go">生成して保存</button><pre id="log">待機中</pre><script>
const S={fish:'https://raw.githubusercontent.com/alexislours/ACNHAPI/refs/heads/master/fish.json',bugs:'https://raw.githubusercontent.com/alexislours/ACNHAPI/refs/heads/master/bugs.json',sea:'https://raw.githubusercontent.com/alexislours/ACNHAPI/refs/heads/master/sea.json'};
const LOC={River:'川',Pond:'池','River (Clifftop)':'崖の上','River (Mouth)':'河口',Sea:'海',Pier:'桟橋','Sea (when raining or snowing)':'海（雨・雪）',Flying:'空中','Flying by light':'明かりの近く','Flying near water':'水辺の空中','On trees':'木','On palm trees':'ヤシの木','On tree stumps':'切り株','On the ground':'地面',Underground:'地中','On flowers':'花','On white flowers':'白い花','On rotten food':'腐った食べ物','On villagers':'住民','On rocks':'岩','On the beach':'砂浜','Disguised on shoreline':'海岸に擬態','Pushing snowballs':'雪玉','On rivers/ponds':'川・池の水面','On trash items':'ゴミ'};
const SH={'Smallest (1)':'極小','Small (2)':'小','Medium (3)':'中','Medium (4)':'中大','Large (5)':'大','Largest (6)':'特大','Large w/Fin (6)':'背びれ',Long:'細長'},SP={Stationary:'動かない','Very slow':'とても遅い',Slow:'遅い',Medium:'普通',Fast:'速い','Very fast':'とても速い'};
function norm(obj,type){return Object.values(obj).map(x=>{const a=x.availability||{};const hours=[...new Set((a['time-array']||[]).map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<24))];const months={northern:[...new Set((a['month-array-northern']||[]).map(Number))],southern:[...new Set((a['month-array-southern']||[]).map(Number))]};let detail='';if(type==='fish')detail=`魚影：${SH[x.shadow]||x.shadow||'—'}`;if(type==='sea')detail=`影：${x.shadow||'—'}／速さ：${SP[x.speed]||x.speed||'—'}`;return{key:`${type}-${x.id}`,type,id:x.id,name:x.name?.['name-JPja']||x['file-name'],location:LOC[a.location]||a.location||'—',price:Number(x.price||0),months,hours,detail}})}
function validate(all){const bad=all.filter(x=>x.hours.some(h=>h<0||h>23)||x.months.northern.some(m=>m<1||m>12)||x.months.southern.some(m=>m<1||m>12));if(bad.length)throw new Error(`不正データ ${bad.length}件`);const golden=all.find(x=>x.name==='オウゴンオニクワガタ');if(!golden)throw new Error('オウゴンオニクワガタが見つかりません');const expected=[0,1,2,3,4,5,6,7,17,18,19,20,21,22,23];if(JSON.stringify([...golden.hours].sort((a,b)=>a-b))!==JSON.stringify(expected))throw new Error(`オウゴンオニクワガタの時間が想定外: ${golden.hours}`)}
document.querySelector('#go').onclick=async()=>{const log=document.querySelector('#log');try{log.textContent='取得中…';const pairs=await Promise.all(Object.entries(S).map(async([t,u])=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${t}: HTTP ${r.status}`);return norm(await r.json(),t)}));const all=pairs.flat();validate(all);const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);log.textContent=`完了：${all.length}件。オウゴンオニクワガタは17時〜翌8時（8時は含まない）として保存しました。`}catch(e){log.textContent='失敗：'+e.message}};
</script></body></html>
